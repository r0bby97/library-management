<!-- login ermöglicht den Zugriff auf die Webseite für RN mit richtiger E-Mail und Passwort. Ein Interessent kann von hier
aus zur Registrierung kommen durch "Sign up" -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!--Smartphoneoptimiert-->
    <link href="css/styleLogin.css" rel="stylesheet">
</head>

<body>
    <form class="login">
        <h1>Login</h1>
        <div class="input">
            <label><b></b></label>
            <input type="email" placeholder="E-Mail" />
        </div>
        <div class="input">
            <label><b></b></label>
            <input type="password" placeholder="Password" />
        </div>
        <input type="submit" class="button" value="Login">
        <div class="signUp">
            Don't have an acoount? <a href="signUp.html">Sign up</a>
        </div>
    </form>
</body>
</html>
