<!-- Durch signUp.html kann ein Interessent zu einem RN werden. Hierfür werden Daten benötigt wie beispielsweise Vorname,
Nachname, E-Mail und Passwort. Falls bereits ein Account besteht, kann man direkt zum Login über "Login" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sign up</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!--Smartphoneoptimiert-->
  <link href="css/styleSignUp.css" rel="stylesheet">
  <script src="scripts/jquery-3.5.1.min.js"></script>
</head>

<!-- Zum vermeiden von Postback -->
<body onkeypress="return DisableEnterKey(event);">
  <form class="signUp" action="php/DBverwaltung.php" method="POST">
    <h1>Sign up</h1>
    <div class="input">
      <label><b></b></label>
      <input type="text" name="vorname" placeholder="First Name"
      pattern="(?=.*[a-zäöüß])(?=.*[A-ZÄÖÜ]).{2,}" title="Must contain at least one uppercase and lowercase letter, and at least 2 or more characters." required/>
    </div>
    <div class="input">
      <label><b></b></label>
      <input type="text" name="nachname" placeholder="Last Name"
      pattern="(?=.*[a-zäöüß])(?=.*[A-ZÄÖÜ]).{2,}" title="Must contain at least one uppercase and lowercase letter, and at least 2 or more characters." required/>
    </div>
    <div class="input">
      <label><b></b></label>
      <input type="email" name="email" placeholder="E-Mail"
      pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Enter a correct E-mail format." required/>
    </div>
    <div class="input">
      <label for="pass1"><b></b></label>
      <input type="password" id="pass1" name="passwort" placeholder="Password"
      pattern="(?=.*\d).{5,}" title="Must contain at least one number and at least 5 or more characters" required/>
    </div>
    <div class="input">
      <label for="pass2"><b></b></label>
      <input type="password" id="pass2" placeholder="Confirm Password" required/>
    </div>

    <div id="Pass1Message">
      <p id="length" class="incorrect"> Minimum of 5 characters </p>
      <p id="number" class="incorrect"> A number </p>
    </div>
    <div id="Pass2Message">
      <p id="differentPass" class="incorrect"> Password must be the same </p>
    </div>

    <input type="submit" class="button" value="Sign up">

    <div class="login">
      Already have an Account? <a href="login.html">Login</a>
    </div>

  <script>
  // Hier werden bestimmte Inhalte des Passwortes geprüft
  var pass1 = document.getElementById("pass1");
  var pass2 = document.getElementById("pass2");
  var number = document.getElementById("number");
  var length = document.getElementById("length");

  // Wenn der Nutzer auf das Passwortfeld1 drückt, erscheinen Informationsnachrichten
  pass1.onfocus = function() {
    document.getElementById("Pass1Message").style.display = "block";
  }
  // Wenn der Nutzer auf das Passwortfeld2 drückt, erscheinen Informationsnachrichten
  pass2.onfocus = function() {
    document.getElementById("Pass2Message").style.display = "block";
  }

  // Wenn der Nutzer ausserhalb des Passwortfeldes1 drückt verschwinden die Informationen
  pass1.onblur = function() {
    document.getElementById("Pass1Message").style.display = "none";
  }
  // Wenn der Nutzer ausserhalb des Passwortfeldes2 drückt verschwinden die Informationen
  pass2.onblur = function() {
    document.getElementById("Pass2Message").style.display = "none";
  }

  // Wenn der Nutzer beginnt etwas in das Passwortfeld1 zu tippen
  pass1.onkeyup = function() {
    // Mindestens eine Zahl
    var zahlen = /[0-9]/g;
    if (pass1.value.match(zahlen)) {
      number.classList.remove("incorrect");
      number.classList.add("correct");
    } else {
      number.classList.remove("correct");
      number.classList.add("incorrect");
    }
    // Mindestens 5 Zeichen
    if (pass1.value.length >= 5) {
      length.classList.remove("incorrect");
      length.classList.add("correct");
    } else {
      length.classList.remove("correct");
      length.classList.add("incorrect");
    }
  }
  // Wenn der Nutzer beginnt etwas in das Passwortfeld1 zu tippen
  pass2.onkeyup = function() {
    // Pass1 gleich Pass2
    if (pass2.value == pass1.value) {
      differentPass.classList.remove("incorrect");
      differentPass.classList.add("correct");
    } else {
      differentPass.classList.remove("correct");
      differentPass.classList.add("incorrect");
    }
  }
  </script>

  <script>
  function DisableEnterKey(e) { // verhindert Postback
     var key;
     if(window.event) {
          key = window.event.keyCode; //IE
     } else {
          key = e.which; //firefox
        }
     return (key != 13);
   }
  </script>

  </form>
</body>
</html>
