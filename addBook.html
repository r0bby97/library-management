<!-- Hier lassen sich Bücher vom B in die DB hinzufügen. Inhalte sind: Titelbild, Titel, Autor,... -->
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Add Book</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!--Smartphoneoptimiert-->
  <link href="css/styleAddBook.css" rel="stylesheet">
</head>

<!-- Zum vermeiden von Postback -->
<body onkeypress="return DisableEnterKey(event);">
  <form class="addBook">
    <div class="logoutButton">
      <a href="login.html">Logout</a>
    </div>
    <div class="backButton">
      <a href="allBooks.html">Back</a>
    </div>
    <h1>Add Book</h1>
    <div class="input">
      <label for="file"><b></b></label>
      <input type="file" name="file" id="file" required/>
    </div>
    <div class="input">
      <label><b></b></label>
      <input type="text" placeholder="Title"
      pattern="(?=.*[a-z])(?=.*[A-Z]).{2,}" title="Must contain at least one uppercase and lowercase letter, and at least 2 or more characters." required/>
    </div>
    <div class="input">
      <label><b></b></label>
      <input type="text" placeholder="Description"
      pattern="(?=.*[a-z])(?=.*[A-Z]).{2,}" title="Must contain at least one uppercase and lowercase letter, and at least 2 or more characters." required/>
    </div>
    <div class="input">
      <label><b></b></label>
      <input type="text" placeholder="Author"
      pattern="(?=.*[a-z])(?=.*[A-Z]).{2,}" title="Must contain at least one uppercase and lowercase letter, and at least 2 or more characters." required/>
    </div>
    <div class="input">
      <label><b></b></label>
      <input type="number" placeholder="Release year" required/>
    </div>
    <input type="submit" class="button" value="Add">
  </form>

  <script>
  function DisableEnterKey(e) { // verhindert Postback
     var key;
     if(window.event) {
          key = window.event.keyCode; //IE
     } else {
          key = e.which; //firefox
        }
     return (key != 13);
   }
  </script>

</body>
</html>
